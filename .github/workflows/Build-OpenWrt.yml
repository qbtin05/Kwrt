name: Build OpenWrt

on: 
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select target device (platform or specific model)'
        required: true
        type: choice
        default: rockchip_armv8_hinlink_opc-h69k
        options:
          # x86 platforms
          - x86_64
          - x86_generic
          # Rockchip ARM devices
          - rockchip_armv8
          - rockchip_armv8_friendlyarm_nanopi-r2s
          - rockchip_armv8_friendlyarm_nanopi-r4s
          - rockchip_armv8_friendlyarm_nanopi-r4se
          - rockchip_armv8_friendlyarm_nanopi-r5s
          - rockchip_armv8_friendlyarm_nanopi-r5c
          - rockchip_armv8_friendlyarm_nanopi-r6s
          - rockchip_armv8_friendlyarm_nanopi-r6c
          - rockchip_armv8_friendlyarm_nanopi-zero2
          - rockchip_armv8_radxa_rock-5a
          - rockchip_armv8_radxa_rock-5b
          - rockchip_armv8_xunlong_orangepi-r1-plus
          - rockchip_armv8_xunlong_orangepi-r1-plus-lts
          - rockchip_armv8_hinlink_opc-h68k
          - rockchip_armv8_hinlink_opc-h69k
          # BCM27xx (Raspberry Pi) devices
          - bcm27xx_bcm2708
          - bcm27xx_bcm2709
          - bcm27xx_bcm2710
          - bcm27xx_bcm2711
          - bcm27xx_bcm2712
          # BCM53xx devices
          - bcm53xx
          - bcm53xx_phicomm-k3
          - bcm53xx_asus-rt-ac88u
          - bcm53xx_dlink-dir-885l
          # ARM server
          - armsr_armv8
          # MediaTek devices
          - mediatek_filogic
          - mediatek_mt7622
          # Qualcomm devices
          - qualcommax_ipq50xx
          - qualcommax_ipq60xx
          - qualcommax_ipq807x
          - ipq40xx_generic
          - ipq806x_generic
          # Ralink/MediaTek devices
          - ramips_mt7620
          - ramips_mt7621
          - ramips_mt76x8
          # Amlogic devices
          - amlogic_meson
          - amlogic_meson8b
          # Other devices
          - mvebu_cortexa9
          - sunxi_cortexa53
          - sunxi_cortexa7
          - ath79_nand
          - airoha_an7581
          - siflower_sf21
      action:
        description: 'Select actions (space-separated: ssh nocache notg noser cw pkg tags)'
        required: false
        type: string
        default: ' nocache notg noser cw pkg'
      repo_url:
        description: 'Repository URL'
        required: false
        type: string
        default: 'https://github.com/openwrt/openwrt'
      repo_branch:
        description: 'Repository Branch'
        required: false
        type: string
        default: ''
      config_file:
        description: 'Config File'
        required: false
        type: string
        default: '.config'
      diy_sh:
        description: 'DIY Script'
        required: false
        type: string
        default: 'diy.sh'
      free_up_disk:
        description: 'Free up disk space'
        required: false
        type: boolean
        default: true
      upload_bin_dir:
        description: 'Upload bin directory to artifact'
        required: false
        type: boolean
        default: false
      upload_firmware_artifact:
        description: 'Upload firmware to artifact'
        required: false
        type: boolean
        default: false
      upload_firmware_release:
        description: 'Upload firmware to release'
        required: false
        type: boolean
        default: true
env:
  REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
  PPPOE_PASSWD: ${{ secrets.PPPOE_PASSWD }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_ID: ${{ secrets.DOCKER_ID }}
  DOCKER_PASSWD: ${{ secrets.DOCKER_PASSWD }}
  TZ: Asia/Shanghai

jobs:
  build:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    name: Build ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ github.event.client_payload.target || github.event.inputs.target }}"]
        
    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: Cancel running workflows
      uses: styfle/cancel-workflow-action@main
      if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.action, 'cw')
      with:
        workflow_id: all
        access_token: ${{ secrets.GITHUB_TOKEN }}


    - name: Set action parameters
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
        else
          echo "ACTION=${{ github.event.action }}" >> $GITHUB_ENV
        fi

    - name: Load Settings.ini
      run: |
        TARGET_DEVICE="${{matrix.target}}"
        echo "Target device: $TARGET_DEVICE"
        
        # Extract base platform from target
        # First, check if the target itself is a valid device directory
        if [ -d "devices/$TARGET_DEVICE" ]; then
          BASE_PLATFORM="$TARGET_DEVICE"
        else
          # Try to extract platform by progressively removing device-specific parts
          # Supports two naming patterns:
          #   1. platform_subtarget_vendor_model (e.g., rockchip_armv8_hinlink_opc-h69k)
          #   2. platform_vendor-model (e.g., bcm53xx_phicomm-k3)
          
          # Count underscores to determine structure
          underscore_count=$(echo "$TARGET_DEVICE" | tr -cd '_' | wc -c)
          
          # Try removing progressively more parts until we find a valid directory
          if [ "$underscore_count" -ge 3 ]; then
            # Try removing last 2 underscore-delimited parts first (vendor_model)
            BASE_PLATFORM=$(echo "$TARGET_DEVICE" | rev | cut -d'_' -f3- | rev)
            if [ ! -d "devices/$BASE_PLATFORM" ]; then
              # Try removing last 1 part (model only)
              BASE_PLATFORM=$(echo "$TARGET_DEVICE" | rev | cut -d'_' -f2- | rev)
            fi
          elif [ "$underscore_count" -eq 2 ]; then
            # Try removing last 1 part first
            BASE_PLATFORM=$(echo "$TARGET_DEVICE" | rev | cut -d'_' -f2- | rev)
            if [ ! -d "devices/$BASE_PLATFORM" ]; then
              # Try removing last 2 parts as fallback
              BASE_PLATFORM=$(echo "$TARGET_DEVICE" | rev | cut -d'_' -f3- | rev)
            fi
          elif [ "$underscore_count" -eq 1 ]; then
            # Try removing last 1 part
            BASE_PLATFORM=$(echo "$TARGET_DEVICE" | rev | cut -d'_' -f2- | rev)
          else
            # No underscores, use as-is
            BASE_PLATFORM="$TARGET_DEVICE"
          fi
          
          # Final validation - fail if platform directory doesn't exist
          if [ ! -d "devices/$BASE_PLATFORM" ]; then
            echo "Error: Could not find device directory for platform '$BASE_PLATFORM' (extracted from target '$TARGET_DEVICE')"
            echo "Available platforms:"
            ls -1 devices/ | grep -v "^common$" | sed 's/^/  - /'
            exit 1
          fi
        fi
        
        echo "Base platform: $BASE_PLATFORM"
        echo "BASE_PLATFORM=$BASE_PLATFORM" >> $GITHUB_ENV
        
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/$BASE_PLATFORM/settings.ini" ]; then
          source "${{ github.workspace }}/devices/$BASE_PLATFORM/settings.ini"
        fi
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Use workflow inputs when manually triggered
          [ -n "${{ github.event.inputs.repo_url }}" ] && echo "REPO_URL=${{ github.event.inputs.repo_url }}" >> $GITHUB_ENV || echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.repo_branch }}" ] && echo "REPO_BRANCH=${{ github.event.inputs.repo_branch }}" >> $GITHUB_ENV || echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.config_file }}" ] && echo "CONFIG_FILE=${{ github.event.inputs.config_file }}" >> $GITHUB_ENV || echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.diy_sh }}" ] && echo "DIY_SH=${{ github.event.inputs.diy_sh }}" >> $GITHUB_ENV || echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
          echo "FREE_UP_DISK=${{ github.event.inputs.free_up_disk }}" >> $GITHUB_ENV
          echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=${{ github.event.inputs.upload_bin_dir }}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${{ github.event.inputs.upload_firmware_artifact }}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_RELEASE=${{ github.event.inputs.upload_firmware_release }}" >> $GITHUB_ENV
        else
          # Use settings.ini values for repository_dispatch
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
          echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
          echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
          echo "FREE_UP_DISK=${FREE_UP_DISK}" >> $GITHUB_ENV
          echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=${UPLOAD_BIN_DIR_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_RELEASE=${UPLOAD_FIRMWARE_FOR_RELEASE}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_TO_COWTRANSFER=${UPLOAD_FIRMWARE_TO_COWTRANSFER}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_TO_WETRANSFER=${UPLOAD_FIRMWARE_TO_WETRANSFER}" >> $GITHUB_ENV
        fi
        sed -i "1a REPO_TOKEN=${{ secrets.GITHUB_TOKEN }}" ${{ github.workspace }}/devices/common/diy.sh
        sed -i "1a TARGET=\"$TARGET_DEVICE\"" ${{ github.workspace }}/devices/common/diy.sh


    # - name: Free disk space
    #   uses: coder-xiaomo/free-disk-space@main
    #   with:
    #     tool-cache: false
    #     android: true
    #     dotnet: true
    #     haskell: true
    #     large-packages: true
    #     docker-images: true
    #     swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        VERSION="$(echo "${{env.ACTION}}" | grep -Eo " [0-9.]+" | sed -e 's/ //')" || true
        [ "$VERSION" ] && echo "VERSION=$VERSION" >> $GITHUB_ENV || echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

    - name: Clone source code
      run: |
        set -x
        TAG_INFO="$(curl -gs -H 'Content-Type: application/json' \
           -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
           -X POST -d '{ "query": "query {repository(owner: \"openwrt\", name: \"openwrt\") {refs(refPrefix: \"refs/tags/\", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' https://api.github.com/graphql)"
        TAG_DATE="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' | head -n 1)"
        if [[ $(( ($(date +%s) - $(date -d "$TAG_DATE" +%s)) / 86400 )) -lt 10 || "${{ contains(env.ACTION, 'tags') }}" == "true" ]]; then
        REPO_BRANCH="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[].name' | grep v25 | head -n 1)"
        else
        REPO_BRANCH="openwrt-24.10"
        fi
        #echo "CONFIG_VERSION_REPO=\"https://dl.openwrt.ai/releases/`echo $REPO_BRANCH  | cut -d . -f 1,2 | sed -e 's/^v//'`\"">>devices/common/.config
        echo "CONFIG_VERSION_REPO=\"https://dl.openwrt.ai/releases/24.10\"">>devices/common/.config
        if [[ ! "${{ env.REPO_BRANCH }}" && "$REPO_URL" == "https://github.com/openwrt/openwrt" ]]; then
            git clone $REPO_URL -b $REPO_BRANCH openwrt
        elif [[ ! "${{ env.REPO_BRANCH }}" ]]; then
            git clone $REPO_URL openwrt
        else
            REPO_BRANCH="${{env.REPO_BRANCH}}"
            if [[ ${#REPO_BRANCH} -lt 10 ]]; then
                git clone $REPO_URL -b ${REPO_BRANCH} openwrt
            else
                git clone $REPO_URL openwrt
                cd openwrt
                git checkout ${REPO_BRANCH}
            fi
        fi

    # - name: Free up disk space
    #   env:
    #     DEBIAN_FRONTEND: noninteractive
    #   run: |
    #     sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
    #     ln -sf /mnt/openwrt/build_dir openwrt/build_dir
    #     sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

    - name: Load custom configuration
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        cp -rf devices/common/. openwrt/
        cp -rf devices/$BASE_PLATFORM/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        chmod +x devices/common/$DIY_SH
        /bin/bash "devices/common/$DIY_SH"
        cp -f devices/common/$CONFIG_FILE .config
        if [ -f "devices/$BASE_PLATFORM/$CONFIG_FILE" ]; then
          echo >> .config
          cat devices/$BASE_PLATFORM/$CONFIG_FILE >> .config
        fi
        
        # Add device-specific configuration when a specific device is selected
        TARGET_DEVICE="${{matrix.target}}"
        BASE_PLATFORM="${{ env.BASE_PLATFORM }}"
        if [ "$TARGET_DEVICE" != "$BASE_PLATFORM" ]; then
          # Extract device name from TARGET_DEVICE (e.g., rockchip_armv8_friendlyarm-nanopi-r5s -> friendlyarm-nanopi-r5s)
          DEVICE_NAME="${TARGET_DEVICE#${BASE_PLATFORM}_}"
          
          # Validate that device name was extracted successfully
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "$TARGET_DEVICE" ]; then
            echo "Error: Failed to extract device name from $TARGET_DEVICE"
            exit 1
          fi
          
          echo "Specific device selected: $DEVICE_NAME"
          
          # Use device name as-is (OpenWrt device names preserve hyphens)
          DEVICE_VAR="$DEVICE_NAME"
          
          # Add configuration to build only the selected device
          echo "" >> .config
          echo "# Build only selected device" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_PER_DEVICE_ROOTFS=y" >> .config
          echo "CONFIG_TARGET_DEVICE_${BASE_PLATFORM}_DEVICE_${DEVICE_VAR}=y" >> .config
        fi
        
        if [ -f "devices/$BASE_PLATFORM/$DIY_SH" ]; then
          chmod +x devices/$BASE_PLATFORM/$DIY_SH
          echo "/bin/bash devices/$BASE_PLATFORM/$DIY_SH"
          /bin/bash "devices/$BASE_PLATFORM/$DIY_SH"
        fi
        cp -Rf ./diy/* ./ || true

    - name: Apply patches
      run: |
        cd openwrt
        BASE_PLATFORM="${{ env.BASE_PLATFORM }}"
        cp -rn devices/common/patches devices/$BASE_PLATFORM/ 2>/dev/null || true
          if [ -n "$(ls -A devices/$BASE_PLATFORM/patches/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/$BASE_PLATFORM/patches/*.bin.patch
          fi
          find "devices/$BASE_PLATFORM/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null | sort -z | xargs -I % -t -0 -n 1 sh -c "cat '%'  | patch -d './' -R -B --merge -p1 --forward" || true
          find "devices/$BASE_PLATFORM/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null | sort -z | xargs -I % -t -0 -n 1 sh -c "cat '%'  | patch -d './' -B --merge -p1 --forward" || true
        sed -i '$a  \
        CONFIG_CPU_FREQ_GOV_POWERSAVE=y \
        CONFIG_CPU_FREQ_GOV_USERSPACE=y \
        CONFIG_CPU_FREQ_GOV_ONDEMAND=y \
        CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y \
        CONFIG_CRYPTO_CHACHA20_NEON=y \
        CONFIG_CRYPTO_CHACHA20POLY1305=y \
        CONFIG_FAT_DEFAULT_IOCHARSET="utf8" \
        ' `find target/linux -path "target/linux/*/config-*"`

    - name: Defconfig
      run: |
        cd openwrt
        BASE_PLATFORM="${{ env.BASE_PLATFORM }}"
        make defconfig
        if [[ ! "$BASE_PLATFORM" =~ ^(amlogic_meson8b|armsr_armv8|bcm27xx_|rockchip_armv8|sunxi_|x86_|siflower_) ]]; then
        sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
        sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
        make defconfig
        fi
        cat .config

    - name: Cache
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'false'
        mixkey: ${{ matrix.target }}
        clean: ${{ contains(env.ACTION, 'nocache') }}
        prefix: ${{ github.workspace }}/openwrt


    - name: Compile the firmware
      id: compile
      run: |
        shopt -s extglob
        df -hT
        cd openwrt
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || { log=$(mktemp);make V=sc &>$log; } || { tail -50 $log; df -hT;exit 1; }
        rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
        rm -rf staging_dir/toolchain-*/initial
        df -hT

    - name: Organize files
      id: organize
      continue-on-error: true
      run: |
        shopt -s extglob
        cd openwrt/bin/targets/*/*/
        cp $GITHUB_WORKSPACE/openwrt/.config ${{matrix.target}}.config || true
        cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config ${{matrix.target}}_kernel.config || true
        Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
        echo "EMOJI=${Emoji[$[$RANDOM % ${#Emoji[@]}]]}" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV


    - name: Create release
      id: create_release
      if: env.REPO_TOKEN && env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      continue-on-error: true
      run: |
        [ ${{ env.NOTICE }} ] && echo -e "${{ env.NOTICE }}" >> release.txt || true

    - name: Upload firmware for release
      uses: softprops/action-gh-release@master
      continue-on-error: true
      if: env.REPO_TOKEN && env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.trx
        name: ${{ env.date2 }} ${{matrix.target}} ${{ env.EMOJI }}
        tag_name: ${{ env.date }}_${{matrix.target}}
        body_path: release.txt
    
    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      continue-on-error: true
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 100
        keep_minimum_runs: 0

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      continue-on-error: true
      if: env.UPLOAD_FIRMWARE_FOR_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 15
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}